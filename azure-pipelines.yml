# Pipeline piloto: build & deploy epdata-clientes a AWS ECS Fargate.
# Autenticacion: OIDC Workload Identity Federation (sin claves AWS en ADO).
# Pre-requisito: Service Connection AWS llamada 'aws-deploy-epdata-clientes'
# apuntando al role IAM arn:aws:iam::442500115196:role/ado-deploy-epdata-clientes

trigger:
  branches:
    include:
      - master
      - main

pr: none

variables:
  awsServiceConnection: 'aws-deploy-epdata-clientes'
  awsRegion: 'eu-west-1'
  ecrRegistry: '442500115196.dkr.ecr.eu-west-1.amazonaws.com'
  ecrRepository: 'epdata/clientes'
  ecsCluster: 'epdata-cluster'
  ecsService: 'epdata-clientes-service-production'
  taskDefinitionFamily: 'epdata-clientes-production'
  ecsTaskDefRevisionsToKeep: 1
  dockerContextPath: 'AgenciaDeDatosClientes/Dashboard'
  dotnetProject: 'AgenciaDeDatosClientes/Dashboard/Dashboard.csproj'

name: $(Date:yyyy.MM.dd).$(Rev:rrr)

stages:
  - stage: Build
    displayName: 'Build & test'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '9.0.x'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate to private NuGet feed (AgenciaDeDatos)'

          - script: dotnet restore $(dotnetProject)
            displayName: 'dotnet restore'

          # dotnet build no copia wwwroot al output: el Dockerfile espera estáticos de publish.
          - script: |
              dotnet publish $(dotnetProject) -c Release --no-restore
              PUBLISH_DIR="$(dockerContextPath)/bin/Release/net9.0/publish"
              test -f "${PUBLISH_DIR}/Dashboard.dll"
              test -f "${PUBLISH_DIR}/wwwroot/css/critical/cabecera.min.css"
              test -f "${PUBLISH_DIR}/wwwroot/css/main/dashboard.min.css"
              test -f "${PUBLISH_DIR}/wwwroot/css/main/footer.min.css"
              test -f "${PUBLISH_DIR}/wwwroot/js/include/carga-dinamica.js"
              test -f "${PUBLISH_DIR}/wwwroot/js/libs/chart.umd.min.js"
              test -f "${PUBLISH_DIR}/wwwroot/js/main/dashboard.min.js"
            displayName: 'dotnet publish (Release)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish compiled bin/ as artifact'
            inputs:
              targetPath: '$(dockerContextPath)/bin'
              artifact: 'dashboard-bin'

  - stage: PushImage
    displayName: 'Build Docker image & push to ECR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DockerJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download compiled bin/'
            inputs:
              artifact: 'dashboard-bin'
              path: '$(dockerContextPath)/bin'

          - task: AWSShellScript@1
            displayName: 'Docker build & push to ECR'
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                IMAGE_TAG="$(Build.BuildNumber)"
                IMAGE_URI="$(ecrRegistry)/$(ecrRepository):${IMAGE_TAG}"

                aws ecr get-login-password --region $(awsRegion) \
                  | docker login --username AWS --password-stdin $(ecrRegistry)

                docker build -t "${IMAGE_URI}" "$(dockerContextPath)"
                docker push "${IMAGE_URI}"

                echo "##vso[task.setvariable variable=imageUri;isOutput=true]${IMAGE_URI}"
            name: dockerPush

  - stage: Deploy
    displayName: 'Deploy to ECS (new task def revision + force redeploy)'
    dependsOn: PushImage
    condition: succeeded()
    jobs:
      - job: DeployJob
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          imageUri: $[ stageDependencies.PushImage.DockerJob.outputs['dockerPush.imageUri'] ]
        steps:
          - task: AWSShellScript@1
            displayName: 'Register new task definition revision'
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                # Coger la revision activa y reemplazar solo la image URI del unico container.
                aws ecs describe-task-definition \
                  --task-definition $(taskDefinitionFamily) \
                  --region $(awsRegion) \
                  --query 'taskDefinition' \
                  --output json > current-td.json

                jq --arg img "$(imageUri)" '
                  .containerDefinitions[0].image = $img
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy)
                ' current-td.json > new-td.json

                NEW_TD_ARN=$(aws ecs register-task-definition \
                  --cli-input-json file://new-td.json \
                  --region $(awsRegion) \
                  --query 'taskDefinition.taskDefinitionArn' \
                  --output text)

                NEW_REV="${NEW_TD_ARN##*:}"
                echo "Registered: ${NEW_TD_ARN} (revision ${NEW_REV})"
                echo "##vso[task.setvariable variable=newTaskDefArn]${NEW_TD_ARN}"
                echo "##vso[task.setvariable variable=newTaskDefRevision]${NEW_REV}"

          - task: AWSShellScript@1
            displayName: 'Update ECS service & wait for stability'
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                aws ecs update-service \
                  --cluster $(ecsCluster) \
                  --service $(ecsService) \
                  --task-definition "$(newTaskDefArn)" \
                  --force-new-deployment \
                  --region $(awsRegion) \
                  --output json > /dev/null

                echo "Waiting for service to stabilize..."
                aws ecs wait services-stable \
                  --cluster $(ecsCluster) \
                  --services $(ecsService) \
                  --region $(awsRegion)
                echo "Service stable."

          - task: AWSShellScript@1
            displayName: 'Deregister old ECS task definition revisions'
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                FAMILY="$(taskDefinitionFamily)"
                REGION="$(awsRegion)"
                KEEP="$(ecsTaskDefRevisionsToKeep)"
                CURRENT_REV="$(newTaskDefRevision)"

                LAST_TO_DEREGISTER=$((CURRENT_REV - KEEP))
                if [ "${LAST_TO_DEREGISTER}" -lt 1 ]; then
                  echo "Sin limpieza: revision actual ${CURRENT_REV}, se conservan las ultimas ${KEEP}."
                  exit 0
                fi

                echo "Revision nueva: ${CURRENT_REV}. Deregister :1..:${LAST_TO_DEREGISTER} (conservar :$((LAST_TO_DEREGISTER + 1))..:${CURRENT_REV})..."
                DEREGISTERED=0
                for rev in $(seq 1 "${LAST_TO_DEREGISTER}"); do
                  TD="${FAMILY}:${rev}"
                  if ! aws ecs describe-task-definition \
                    --task-definition "${TD}" \
                    --region "${REGION}" \
                    --query 'taskDefinition.taskDefinitionArn' \
                    --output text >/dev/null 2>&1; then
                    continue
                  fi
                  echo "  deregister ${TD}"
                  if ! DEREG_ERR=$(aws ecs deregister-task-definition \
                    --task-definition "${TD}" \
                    --region "${REGION}" 2>&1); then
                    if echo "${DEREG_ERR}" | grep -q 'AccessDeniedException'; then
                      echo "##vso[task.logissue type=error]Falta ecs:DeregisterTaskDefinition en el rol ado-deploy-epdata-clientes (IAM fuera de este repo)."
                      echo "${DEREG_ERR}"
                      exit 1
                    fi
                    echo "  omitido ${TD}: ${DEREG_ERR}"
                    continue
                  fi
                  DEREGISTERED=$((DEREGISTERED + 1))
                done
                echo "Limpieza completada (${DEREGISTERED} revision(es) deregistered)."
