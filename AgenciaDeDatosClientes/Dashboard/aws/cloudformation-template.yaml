AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infraestructura para EpData Dashboard (Clientes) Application ECS Task'

Parameters:
  AccountId:
    Type: String
    Description: 'AWS Account ID'
    Default: '442500115196'
  
  Environment:
    Type: String
    Description: 'Environment name'
    Default: 'production'
    AllowedValues: ['development', 'staging', 'production']
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID donde se ejecutara la aplicacion Dashboard'
    Default: 'vpc-88a6edef'
  
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'IDs de las subnets publicas para ALB'
    Default: 'subnet-48eda92f,subnet-a885cbe1,subnet-f446c6af'
  
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'IDs de las subnets privadas para ECS'
    Default: 'subnet-0b2cce1885e680ac7,subnet-0681b42e3f90a672f,subnet-062eb200cb1ea941e'
  
  AuroraSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: 'IDs de los security groups de Aurora'
    Default: 'sg-5e36d725,sg-2e3cdd55'
  
  RedisSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'ID del security group de Redis/Valkey'
    Default: 'sg-5e36d725'
  
  ExistingClusterName:
    Type: String
    Description: 'Nombre del cluster ECS existente'
    Default: 'epdata-cluster'
  
  SSLCertificateArn:
    Type: String
    Description: 'ARN del certificado SSL para HTTPS'
    Default: 'arn:aws:acm:eu-west-1:442500115196:certificate/71229a5d-b1f4-45b0-b722-1812de77c4d9'
  
  # ARN del ALB existente
  ExistingLoadBalancerArn:
    Type: String
    Description: 'ARN del Application Load Balancer existente'
    Default: 'arn:aws:elasticloadbalancing:eu-west-1:442500115196:loadbalancer/app/epdata-alb/db46e956fe810085'
  
  # ARN del Target Group existente
  ExistingTargetGroupArn:
    Type: String
    Description: 'ARN del Target Group existente para el Dashboard'
    Default: 'arn:aws:elasticloadbalancing:eu-west-1:442500115196:targetgroup/epdata-tg-clientes/053769250265c271'

  # Security Group del ALB existente (ya creado por el stack www)
  # Para encontrar el ID: AWS Console -> EC2 -> Security Groups -> buscar "epdata-alb-sg-production"
  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'ID del Security Group existente para el ALB'
    Default: 'sg-608c121b' 

Resources:
  # IAM Role para la tarea ECS
  EpDataClientesTaskRole:
    Type: AWS::IAM::Role
    DependsOn: 
      - EpDataClientesLogGroup
      - UserLogsDeliveryStream
    Properties:
      RoleName: !Sub 'epdata-clientes-task-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: EpDataClientesExecutionPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/ecs/epdata/clientes'
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/ecs/epdata/clientes:*'
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:*'
        - PolicyName: EpDataClientesPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-valkey*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-aurora*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-google-oauth*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-autologin*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-cdn-transparent*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-s3*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-zilliz*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-openai*'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AccountId}:secret:epdata-anthropic*'
              - Effect: Allow
                Action:
                  - sqs:GetQueueUrl
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                  - sqs:SendMessage
                Resource:
                  - !Sub 'arn:aws:sqs:eu-west-1:${AccountId}:serietipo-actualizado-prioridad-*'
                  - !Sub 'arn:aws:sqs:eu-west-1:${AccountId}:representacion-actualizada-prioridad-*'
                  - !Sub 'arn:aws:sqs:eu-west-1:${AccountId}:plantillaweb-actualizada-prioridad-*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/ecs/epdata/clientes'
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/ecs/epdata/clientes:*'
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource:
                  - !Sub 'arn:aws:rds-db:eu-west-1:${AccountId}:dbuser:*/epdata*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Environment: !Ref Environment
              - Effect: Allow
                Action:
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheClusters
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObjectVersion
                  - s3:PutObjectAcl
                  - s3:GetObjectAcl
                Resource:
                  - !Sub 'arn:aws:s3:::file.epdata.es'
                  - !Sub 'arn:aws:s3:::file.epdata.es/*'
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt UserLogsDeliveryStream.Arn

  # Log Group para los logs del contenedor
  EpDataClientesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: '/aws/ecs/epdata/clientes'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: epdata-clientes

  # NOTA: Los recursos de alertas y alarmas ya existen en el cluster EpData
  # Fueron creados por EpDataPregeneracion y no necesitamos recrearlos aqui
  # Solo los referenciamos en los outputs usando ARNs construidos manualmente

  # NOTA: Los Security Groups de Transparent CDN y ALB ya existen (creados por el stack www)
  # Solo los referenciamos mediante parámetros

  # Security Group para la aplicacion Dashboard
  EpDataClientesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'epdata-clientes-sg-${Environment}'
      GroupDescription: 'Security group para EpData Dashboard (Clientes) Application ECS Task'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: 'HTTP inbound from ALB'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS outbound'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'All outbound traffic'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS outbound'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP outbound for third-party services'
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          DestinationSecurityGroupId: !Select [0, !Ref AuroraSecurityGroupIds]
          Description: 'MySQL to Aurora'
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          DestinationSecurityGroupId: !Ref RedisSecurityGroupId
          Description: 'Redis to ElastiCache'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: epdata-clientes

  # Reglas de seguridad para Aurora - Permitir acceso desde nuestro task
  # Nota: Estas reglas pueden ya existir si EpDataPregeneracion ya las creo
  # CloudFormation manejara automaticamente los duplicados
  AuroraSecurityGroupRule1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Select [0, !Ref AuroraSecurityGroupIds]
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EpDataClientesSecurityGroup
      Description: !Sub 'Allow Aurora access from EpData Dashboard task - ${Environment}'

  AuroraSecurityGroupRule2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Select [1, !Ref AuroraSecurityGroupIds]
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EpDataClientesSecurityGroup
      Description: !Sub 'Allow Aurora access from EpData Dashboard task - ${Environment}'

  # Regla de seguridad para Redis - Permitir acceso desde nuestro task
  RedisSecurityGroupRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RedisSecurityGroupId
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EpDataClientesSecurityGroup
      Description: !Sub 'Allow Redis access from EpData Dashboard task - ${Environment}'

  # Regla de seguridad para permitir ALB -> ECS (agregada como regla separada)
  # Nota: Esta regla puede ya existir si el stack www la creo
  # CloudFormation manejara automaticamente los duplicados
  ALBToECSSecurityGroupRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EpDataClientesSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ALBSecurityGroupId
      Description: !Sub 'Allow ALB access to ECS Dashboard - ${Environment}'

  # Task Definition
  EpDataClientesTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: 
      - EpDataClientesLogGroup
      - EpDataClientesTaskRole
    Properties:
      Family: !Sub 'epdata-clientes-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt EpDataClientesTaskRole.Arn
      TaskRoleArn: !GetAtt EpDataClientesTaskRole.Arn
      ContainerDefinitions:
        - Name: epdata-clientes
          Image: !Sub '${AccountId}.dkr.ecr.eu-west-1.amazonaws.com/epdata/clientes:2025.10.31.001'
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: ASPNETCORE_ENVIRONMENT
              Value: !Ref Environment
            - Name: AWS_REGION
              Value: eu-west-1
            - Name: ASPNETCORE_URLS
              Value: http://+:8080
            - Name: DOTNET_RUNNING_IN_CONTAINER
              Value: 'true'
            - Name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              Value: 'false'
          LinuxParameters:
            InitProcessEnabled: true #esto habilita que podamos conectarnos via bash al contenedor de produccion con el arn de nuestra instancia
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: '/aws/ecs/epdata/clientes'
              awslogs-region: eu-west-1
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/healthcheck || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          StopTimeout: 30
          Ulimits:
            - Name: nofile
              SoftLimit: 65536
              HardLimit: 65536
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: epdata-clientes

  # ===== ECS SERVICE CON LOAD BALANCER =====
  EpDataClientesService:
    Type: AWS::ECS::Service
    DependsOn: 
      - EpDataClientesLogGroup
      - EpDataClientesTaskDefinition
      - ALBToECSSecurityGroupRule
    Properties:
      ServiceName: !Sub 'epdata-clientes-service-${Environment}'
      Cluster: !Ref ExistingClusterName
      TaskDefinition: !Ref EpDataClientesTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 0 # Ponemos a 0 en el instante de la creacion, luego lo subimos a 1 desde la consola web de AWS
      EnableExecuteCommand: true #esto habilita que podamos conectarnos via bash al contenedor de produccion con el arn de nuestra instancia
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds #SUBNETS PRIVADAS
          SecurityGroups:
            - !Ref EpDataClientesSecurityGroup
          AssignPublicIp: DISABLED #SIN IP PUBLICA
      LoadBalancers:
        - TargetGroupArn: !Ref ExistingTargetGroupArn #USA TARGET GROUP EXISTENTE
          ContainerName: epdata-clientes
          ContainerPort: 8080
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 120
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: epdata-clientes

  # ===== CONFIGURACION DE EXPORTACION AUTOMATICA DE LOGS A S3 =====

  # 1. PRIMERO: Log Group para Kinesis Data Firehose
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: '/aws/kinesisfirehose/epdata-clientes-logs'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: epdata-clientes-logs

  # 2. SEGUNDO: IAM Role para Kinesis Data Firehose
  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    DependsOn: FirehoseLogGroup
    Properties:
      RoleName: !Sub 'epdata-clientes-firehose-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetBucketAcl
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectAcl
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::file.epdata.es'
                  - !Sub 'arn:aws:s3:::file.epdata.es/*'
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: 
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/kinesisfirehose/epdata-clientes-logs*'
                  - !Sub 'arn:aws:logs:eu-west-1:${AccountId}:log-group:/aws/kinesisfirehose/epdata-clientes-logs'

  # 3. TERCERO: Delivery Stream
  UserLogsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn: 
      - FirehoseDeliveryRole
      - FirehoseLogGroup
    Properties:
      DeliveryStreamName: !Sub 'epdata-clientes-logs-${Environment}'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Sub 'arn:aws:s3:::file.epdata.es'
        Prefix: 'logs/clientes/!{timestamp:yyyy}/!{timestamp:MM}/!{timestamp:dd}/'
        ErrorOutputPrefix: 'logs/errors/'
        BufferingHints:
          SizeInMBs: 5  # Enviar cada 5MB
          IntervalInSeconds: 900  # Enviar cada 15 minutos, que es el valor maximo
        CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: '/aws/kinesisfirehose/epdata-clientes-logs'
          LogStreamName: 'epdata-clientes-logs-stream'
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        ProcessingConfiguration:
          Enabled: false  # Sin procesamiento adicional

  # ===== CONFIGURACION DE EXPORTACION AUTOMATICA DE LOGS A S3.fin =====

Outputs:
  TaskDefinitionArn:
    Description: 'ARN de la Task Definition'
    Value: !Ref EpDataClientesTaskDefinition
    Export:
      Name: !Sub '${AWS::StackName}-TaskDefinitionArn'
  
  TaskRoleArn:
    Description: 'ARN del IAM Role para la tarea'
    Value: !GetAtt EpDataClientesTaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskRoleArn'
  
  SecurityGroupId:
    Description: 'ID del Security Group'
    Value: !Ref EpDataClientesSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'
  
  AlertsTopicArn:
    Description: 'ARN del SNS Topic para alertas (referencia al existente)'
    Value: !Sub 'arn:aws:sns:eu-west-1:${AccountId}:epdata-alerts-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-AlertsTopicArn'
  
  ClusterHealthAlarmArn:
    Description: 'ARN de la alarma composite de salud del cluster (referencia al existente)'
    Value: !Sub 'arn:aws:cloudwatch:eu-west-1:${AccountId}:alarm:epdata-cluster-health-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ClusterHealthAlarmArn'
  
  ServiceName:
    Description: 'Nombre del service ECS'
    Value: !Ref EpDataClientesService
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'
  
  ServiceArn:
    Description: 'ARN del service ECS'
    Value: !Sub 'arn:aws:ecs:eu-west-1:${AccountId}:service/${ExistingClusterName}/${EpDataClientesService}'
    Export:
      Name: !Sub '${AWS::StackName}-ServiceArn'
  
  TargetGroupArn:
    Description: 'ARN del Target Group existente'
    Value: !Ref ExistingTargetGroupArn
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'
  
  LogGroupName:
    Description: 'Nombre del Log Group'
    Value: !Ref EpDataClientesLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'
  
  # OUTPUTS PARA FIRHOSE
  UserLogsDeliveryStreamName:
    Description: 'Nombre del delivery stream de Kinesis Data Firehose para logs de usuarios'
    Value: !Ref UserLogsDeliveryStream
    Export:
      Name: !Sub '${AWS::StackName}-UserLogsDeliveryStreamName'
  
  UserLogsDeliveryStreamArn:
    Description: 'ARN del delivery stream de Kinesis Data Firehose'
    Value: !GetAtt UserLogsDeliveryStream.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserLogsDeliveryStreamArn'

